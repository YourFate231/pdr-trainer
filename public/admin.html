<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмінка ПДД Тренажера 🛠️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Nunito', Arial, sans-serif;
            background: radial-gradient(circle at top left, #26324a 0%, #131c2e 60%, #0d1220 100%);
            color: #e7ecf5;
            padding: 28px 18px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto 26px auto;
            background: linear-gradient(180deg, #1e2b45 0%, #182238 100%);
            padding: 26px;
            border-radius: 18px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h2 { margin: 0; font-weight: 800; }
        .filters { display: flex; gap: 15px; margin-bottom: 20px; background: #131c2e; padding: 16px; border-radius: 12px; flex-wrap: wrap; align-items: center; }
        .filters select, .filters input {
            padding: 9px 12px; border-radius: 8px; border: 1px solid #2c3a56;
            background: #0f1729; color: #e7ecf5; font-size: 14px; font-family: inherit;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; color: #cdd7ea; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #2c3a56;
            background: #0f1729; color: #e7ecf5; font-size: 14px; font-family: inherit; box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #4facfe; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 12px; border-bottom: 1px solid #26324a; text-align: left; font-size: 14px; }
        th { background: #16223a; color: #9fb3d6; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.03em; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .correct { color: #34d399; font-weight: 700; }
        .incorrect { color: #f87171; font-weight: 700; }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #3498db 100%);
            color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer;
            text-decoration: none; display: inline-block; font-size: 14px; font-weight: 700; font-family: inherit;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn-danger { background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%); }
        .btn-success { background: linear-gradient(135deg, #34d399 0%, #059669 100%); }
        .btn-warning { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #24170a; }
        .btn-link-tool { background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%); margin-bottom: 8px; }
        .add-box { background: #131c2e; padding: 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.04); }
        .wishes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .wish-column { background: #131c2e; padding: 16px; border-radius: 12px; }
        .wish-column h3 { margin-top: 0; }
        .wish-item {
            background: #1c2740; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px;
            border-left: 4px solid #e84393;
        }
        @media (max-width: 600px) {
            .wishes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2 id="form-title">Додати питання в базу ✍️</h2>
        <a href="/" class="btn" style="background: linear-gradient(135deg, #ff9fc4 0%, #e84393 100%);">На головну 🌸</a>
    </div>

    <div class="add-box">
        <form id="add-question-form" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="edit-id" value="">
            <div class="form-group">
                <label>Номер уроку (теми):</label>
                <input type="number" id="q-lesson" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>Текст питання:</label>
                <textarea id="q-text" rows="2" placeholder="Наприклад: Кому зобов'язаний дати дорогу..." required></textarea>
            </div>
            <div class="form-group">
                <label>Завантажити нову картинку/схему з ПК (необов'язково):</label>
                <input type="file" id="q-image-file" accept="image/*">
            </div>
            <div class="form-group">
                <label>Варіанти відповідей (кожен з нового рядка):</label>
                <textarea id="q-answers" rows="3" placeholder="Варіант 1&#10;Варіант 2&#10;Варіант 3" required></textarea>
            </div>
            <div class="form-group">
                <label>Номер правильної відповіді (1, 2, 3...):</label>
                <input type="number" id="q-correct" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>Коментар / пояснення </label>
                <button type="button" class="btn btn-link-tool" onclick="insertLinkPrompt()">🔗 Вставити посилання на ПДР</button>
                <textarea id="q-comment" rows="3" placeholder="Згідно з п. 26.4 ПДР..."></textarea>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="submit" id="submit-btn-elem" class="btn btn-success">Додати питання в базу 🚀</button>
                <button type="button" id="cancel-edit-btn" class="btn btn-danger" style="display: none;" onclick="resetForm()">Скасувати редагування ❌</button>
            </div>
        </form>
    </div>
</div>

<div class="container">
    <div class="header-flex">
        <h2>🎁 Загадані бажання (Настя та Даня)</h2>
        <div>
            <button class="btn btn-warning" onclick="resetWishesOnServer()" style="margin-right: 10px;">🔄 Скинути бажання</button>
            <button class="btn" onclick="loadAdminWishes()">Оновити 🔄</button>
        </div>
    </div>
    <div class="wishes-grid">
        <div class="wish-column">
            <h3 style="color: #ff7675;">🌸 Бажання Насті</h3>
            <div id="nastia-wishes-list">Завантаження...</div>
        </div>
        <div class="wish-column">
            <h3 style="color: #74b9ff;">🛠️ Бажання Дані</h3>
            <div id="dania-wishes-list">Завантаження...</div>
        </div>
    </div>
</div>

<div class="container">
    <h2>База питань 📚</h2>
    <button class="btn" onclick="loadQuestionsList()" style="margin-bottom: 15px; margin-top: 15px;">Оновити список питань 🔄</button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Урок</th>
                <th>Питання</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="questions-table">
            <tr><td colspan="4">Завантаження...</td></tr>
        </tbody>
    </table>
</div>

<div class="container">
    <div class="header-flex">
        <h2>Статистика проходження 📊</h2>
        <button class="btn btn-danger" onclick="clearStats()">Очистити статистику 🗑️</button>
    </div>

    <div class="filters">
        <div>
            <label for="role-filter">Користувач: </label>
            <select id="role-filter" onchange="filterLogs()">
                <option value="all">Усі (Настя + Даня)</option>
                <option value="nastia">🌸 Настя</option>
                <option value="dania">🛠️ Даня</option>
            </select>
        </div>
        <div>
            <label for="lesson-filter">Урок: </label>
            <select id="lesson-filter" onchange="filterLogs()">
                <option value="all">Усі уроки</option>
            </select>
        </div>
        <div>
            <label for="status-filter">Результат: </label>
            <select id="status-filter" onchange="filterLogs()">
                <option value="all">Усі відповіді</option>
                <option value="correct">Тільки правильні ✓</option>
                <option value="incorrect">Тільки помилки ✗</option>
            </select>
        </div>
        <div>
            <label for="date-filter">Дата: </label>
            <input type="date" id="date-filter" onchange="filterLogs()">
        </div>
        <div>
            <button class="btn btn-danger" style="padding: 8px 12px; font-size: 12px;" onclick="resetFilters()">Скинути фільтри</button>
        </div>
    </div>

    <button class="btn" onclick="loadStats()">Оновити дані 🔄</button>

    <table>
        <thead>
            <tr>
                <th>Хто</th>
                <th>Час</th>
                <th>Урок</th>
                <th>ID питання</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="stats-table">
            <tr><td colspan="5">Завантаження...</td></tr>
        </tbody>
    </table>
</div>

<script>
    let allLogs = [];
    let cachedQuestions = [];

    function insertLinkPrompt() {
        const commentField = document.getElementById('q-comment');
        const selectedText = commentField.value.substring(commentField.selectionStart, commentField.selectionEnd);
        const linkText = prompt("Введи текст посилання:", selectedText || "пункт ПДР");
        if (!linkText) return;
        const url = prompt("Введи URL:", "https://zakon.rada.gov.ua/laws/show/1306-2001-п");
        if (!url) return;
        const htmlTag = `<a href='${url}' target='_blank'>${linkText}</a>`;
        commentField.value = commentField.value.substring(0, commentField.selectionStart) + htmlTag + commentField.value.substring(commentField.selectionEnd);
        commentField.focus();
    }

    async function resetWishesOnServer() {
        if (confirm("Точно хочеш очистити всі загадані бажання на сервері?")) {
            const res = await fetch('/api/admin/wishes', { method: 'DELETE' });
            if (res.ok) {
                alert("Всі бажання успішно скинуто! Тепер їх можна загадувати знову.");
                loadAdminWishes();
            } else {
                alert("Помилка при скиданні бажань.");
            }
        }
    }

    async function loadAdminWishes() {
        try {
            const res = await fetch('/api/admin/wishes');
            const wishes = await res.json();

            const nastiaContainer = document.getElementById('nastia-wishes-list');
            const daniaContainer = document.getElementById('dania-wishes-list');

            let nastiaHtml = '';
            let daniaHtml = '';

            if (!wishes || wishes.length === 0) {
                nastiaContainer.innerHTML = '<p style="color: #7c8aa8;">Порожньо</p>';
                daniaContainer.innerHTML = '<p style="color: #7c8aa8;">Порожньо</p>';
                return;
            }

            wishes.slice().reverse().forEach(w => {
                const lessonText = w.lesson ? `Урок №${w.lesson}` : 'Загальне';
                const dateText = w.date ? `(${w.date})` : '';
                const card = `
                    <div class="wish-item">
                        <div style="font-size: 11px; color: #6cb6ff; margin-bottom: 3px;">${lessonText} <span style="color: #7c8aa8;">${dateText}</span></div>
                        <div style="font-size: 14px; font-weight: bold; color: #fbbf24;">"${w.wish}"</div>
                    </div>
                `;
                if (w.role === 'nastia') {
                    nastiaHtml += card;
                } else {
                    daniaHtml += card;
                }
            });

            nastiaContainer.innerHTML = nastiaHtml || '<p style="color: #7c8aa8;">Порожньо</p>';
            daniaContainer.innerHTML = daniaHtml || '<p style="color: #7c8aa8;">Порожньо</p>';
        } catch (e) {
            console.error(e);
        }
    }

    async function loadStats() {
        try {
            const res = await fetch('/api/admin/stats');
            allLogs = await res.json();
            updateLessonDropdown(allLogs);
            filterLogs();
        } catch (e) {
            console.error(e);
        }
    }

    function updateLessonDropdown(logs) {
        const select = document.getElementById('lesson-filter');
        const currentVal = select.value;
        const lessons = [...new Set(logs.map(l => l.lesson || 1))].sort((a, b) => a - b);
        select.innerHTML = '<option value="all">Усі уроки</option>';
        lessons.forEach(l => {
            select.innerHTML += `<option value="${l}">Урок №${l}</option>`;
        });
        select.value = currentVal;
    }

    function resetFilters() {
        document.getElementById('role-filter').value = 'all';
        document.getElementById('lesson-filter').value = 'all';
        document.getElementById('status-filter').value = 'all';
        document.getElementById('date-filter').value = '';
        filterLogs();
    }

    function filterLogs() {
        const roleVal = document.getElementById('role-filter').value;
        const lessonVal = document.getElementById('lesson-filter').value;
        const statusVal = document.getElementById('status-filter').value;
        const dateVal = document.getElementById('date-filter').value;

        let filtered = allLogs.slice().reverse();

        if (roleVal !== 'all') {
            filtered = filtered.filter(log => (log.role || 'nastia') === roleVal);
        }

        if (lessonVal !== 'all') {
            filtered = filtered.filter(log => (log.lesson || 1) == lessonVal);
        }

        if (statusVal === 'correct') {
            filtered = filtered.filter(log => log.isCorrect);
        } else if (statusVal === 'incorrect') {
            filtered = filtered.filter(log => !log.isCorrect);
        }

        if (dateVal) {
            filtered = filtered.filter(log => {
                if (!log.timestamp) return false;
                const logDate = new Date(log.timestamp).toISOString().split('T')[0];
                return logDate === dateVal;
            });
        }

        renderTable(filtered);
    }

    function renderTable(logs) {
        const tbody = document.getElementById('stats-table');
        tbody.innerHTML = '';

        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">Нічого не знайдено за цими фільтрами.</td></tr>';
            return;
        }

        logs.forEach(log => {
            const tr = document.createElement('tr');
            const dateObj = log.timestamp ? new Date(log.timestamp) : new Date();
            const time = dateObj.toLocaleTimeString();
            const date = dateObj.toLocaleDateString();
            const who = (log.role === 'dania') ? '🛠️ Даня' : '🌸 Настя';

            tr.innerHTML = `
                <td><b>${who}</b></td>
                <td>${date} ${time}</td>
                <td>Урок #${log.lesson || 1}</td>
                <td>Питання #${log.questionId}</td>
                <td class="${log.isCorrect ? 'correct' : 'incorrect'}">
                    ${log.isCorrect ? 'Вірно ✓' : 'Помилка ✗'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function loadQuestionsList() {
        try {
            const res = await fetch('/api/admin/questions');
            cachedQuestions = await res.json();
            const tbody = document.getElementById('questions-table');
            tbody.innerHTML = '';
            if (cachedQuestions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">База питань порожня.</td></tr>';
                return;
            }
            cachedQuestions.forEach(q => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${q.id}</td>
                    <td>Урок #${q.lesson || 1}</td>
                    <td>${q.question.substring(0, 50)}...</td>
                    <td>
                        <button class="btn btn-warning" onclick="editQuestion(${q.id})" style="margin-right: 5px;">Редагувати ✏️</button>
                        <button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Видалити 🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) { console.error(e); }
    }

    function editQuestion(id) {
        const q = cachedQuestions.find(item => item.id === id);
        if (!q) return;
        document.getElementById('edit-id').value = q.id;
        document.getElementById('q-lesson').value = q.lesson || 1;
        document.getElementById('q-text').value = q.question || '';
        document.getElementById('q-answers').value = q.answers ? q.answers.join('\n') : '';
        document.getElementById('q-correct').value = (q.correct !== undefined) ? q.correct + 1 : 1;
        document.getElementById('q-comment').value = q.comment || '';
        document.getElementById('form-title').innerText = `Редагувати питання #${q.id} ✏️`;
        document.getElementById('submit-btn-elem').innerText = "Зберегти зміни ✔️";
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('add-question-form').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('q-correct').value = "1";
        document.getElementById('form-title').innerText = "Додати питання в базу ✍️";
        document.getElementById('submit-btn-elem').innerText = "Додати питання в базу 🚀";
        document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    async function deleteQuestion(id) {
        if (confirm(`Точно хочеш видалити питання #${id}?`)) {
            const res = await fetch(`/api/admin/questions/${id}`, { method: 'DELETE' });
            if (res.ok) loadQuestionsList();
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        const editId = document.getElementById('edit-id').value;
        const lesson = document.getElementById('q-lesson').value;
        const question = document.getElementById('q-text').value;
        const imageFile = document.getElementById('q-image-file').files[0];
        const answersRaw = document.getElementById('q-answers').value;
        const correct = Number(document.getElementById('q-correct').value) - 1;
        const comment = document.getElementById('q-comment').value;
        const answers = answersRaw.split('\n').map(a => a.trim()).filter(a => a.length > 0);

        const formData = new FormData();
        formData.append('lesson', lesson);
        formData.append('question', question);
        formData.append('correct', correct);
        formData.append('comment', comment);
        formData.append('answers', JSON.stringify(answers));
        if (imageFile) formData.append('imageFile', imageFile);

        const url = editId ? `/api/admin/questions/${editId}` : '/api/admin/questions';
        const res = await fetch(url, { method: editId ? 'PUT' : 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            alert(editId ? 'Питання оновлено! ✏️' : 'Питання додано! 🎉');
            resetForm();
            loadQuestionsList();
        }
    }

    async function clearStats() {
        if (confirm('Очистити всю статистику?')) {
            const res = await fetch('/api/admin/stats', { method: 'DELETE' });
            if (res.ok) loadStats();
        }
    }

    loadStats();
    loadQuestionsList();
    loadAdminWishes();
</script>

</body>
</html>
